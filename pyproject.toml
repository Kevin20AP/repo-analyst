    { name = "Kevin20AP", email = "apkevin2027@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-anthropic>=1.7.11",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.22",
